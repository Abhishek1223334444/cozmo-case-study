[project]
name = "cozmo"
version = "0.1.0"
description = "Phone captures to dimensioned, stitched floor plans"
readme = "README.md"
authors = [
    { name = "abhishekshawethara", email = "abhishek.shaw@ethara.ai" }
]
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "safetensors>=0.4",
    "scipy>=1.17.1",
    "shapely>=2.1.2",
    "torch>=2.6,<3",
    "transformers>=4.48,<5",
]

[project.scripts]
cozmo = "cozmo.cli:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8,<10",
]
