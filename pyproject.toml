[project]
name = "cozmo"
version = "0.1.0"
description = "Phone captures to dimensioned, stitched floor plans"
readme = "README.md"
authors = [
    { name = "abhishekshawethara", email = "abhishek.shaw@ethara.ai" }
]
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23",
    "lightglue",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pillow>=12.3.0",
    "safetensors>=0.4",
    "scipy>=1.17.1",
    "shapely>=2.1.2",
    "torch>=2.6,<3",
    "transformers>=4.48,<5",
]

[project.scripts]
cozmo = "cozmo.cli:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.16.9",
]

[tool.uv.sources]
lightglue = { git = "https://github.com/cvg/LightGlue.git" }

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
